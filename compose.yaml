services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard_local}
      POSTGRES_DB: meta_ads
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ads_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d meta_ads"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ads_postgres:
